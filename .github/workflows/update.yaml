name: Update Node Info

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-node-info
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.repository.name == 'Cloudflare-Data-Center-IATA-Code-list'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Update datasets
        run: python cloudflare_iata.py update all

      - name: Validate datasets
        run: python cloudflare_iata.py validate

      - name: Commit and Push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git add -- cloudflare-iata.json cloudflare-iata-zh.json cloudflare-iata-full.json en2zh.json

          if git diff --cached --quiet; then
            echo "No changes detected in the dictionaries"
          else
            echo "Changes detected, committing"
            git commit -m "update: node info on $(date +'%Y-%m-%d')"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi
